{{ define "dash-askar/resource/view-content" }}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
            <a href="/admin/{{ .resource.GetSlug }}" class="text-slate-500 hover:text-slate-200 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <h2 class="text-2xl font-bold">{{ .title }}</h2>
        </div>
        <a href="/admin/{{ .resource.GetSlug }}/{{ .id }}/edit" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg transition shadow-lg shadow-blue-500/20 font-medium">
            Edit Record
        </a>
    </div>

    <div class="bg-[#111827] border border-slate-800 rounded-2xl p-8 max-w-4xl shadow-xl ring-1 ring-white/5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-8">
            {{ range .schema }}
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">{{ .Label }}</label>
                <div class="text-slate-200 font-medium bg-[#0b0f19] border border-slate-800 rounded-xl px-4 py-3 min-h-[48px] flex items-center">
                    {{ .Value }}
                </div>
            </div>
            {{ end }}
        </div>
    </div>
</div>
{{ end }}
