{{ define "dash-askar/resource/index-content" }}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold">{{ .title }}</h2>
        <a href="/admin/{{ .resource.GetSlug }}/create" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg transition shadow-lg shadow-blue-500/20 font-medium">
            New {{ .title }}
        </a>
    </div>

    <div class="bg-[#111827] border border-slate-800 rounded-2xl overflow-hidden">
        <table class="w-full text-left">
            <thead>
                <tr class="border-b border-slate-800 bg-slate-900/50">
                    <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">ID</th>
                    <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Name</th>
                    <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Created At</th>
                    <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider text-right">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-800">
                <!-- Sample Row -->
                <tr class="hover:bg-slate-800/30 transition-colors group">
                    <td class="px-6 py-4 text-sm">#1</td>
                    <td class="px-6 py-4 text-sm font-medium">Sample Item</td>
                    <td class="px-6 py-4 text-sm text-slate-500">2026-01-22</td>
                    <td class="px-6 py-4 text-sm text-right space-x-3">
                        <a href="#" class="text-blue-400 hover:text-blue-300 transition">Edit</a>
                        <button class="text-red-400 hover:text-red-300 transition">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{{ end }}
