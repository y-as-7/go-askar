{{ define "dash-askar/resource/edit-content" }}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="/admin/{{ .resource.GetSlug }}" class="text-slate-500 hover:text-slate-200 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        </a>
        <h2 class="text-2xl font-bold">{{ .title }}</h2>
    </div>

    <div class="bg-[#111827] border border-slate-800 rounded-2xl p-8 max-w-4xl shadow-xl ring-1 ring-white/5">
        <form action="/admin/{{ .resource.GetSlug }}/{{ .id }}" method="POST" class="space-y-8">
            <input type="hidden" name="_method" value="PUT">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                {{ range .schema }}
                <div>
                    <label for="{{ .Name }}" class="block text-sm font-medium text-slate-400 mb-2">{{ .Label }}</label>
                    <input type="{{ .Type }}" id="{{ .Name }}" name="{{ .Name }}" 
                        value="{{ .Value }}"
                        placeholder="{{ .Placeholder }}"
                        {{ if .Required }}required{{ end }}
                        class="w-full bg-[#0b0f19] border border-slate-700 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all placeholder-slate-600">
                </div>
                {{ end }}
            </div>

            <div class="flex justify-end pt-6 border-t border-slate-800 gap-4">
                <a href="/admin/{{ .resource.GetSlug }}" class="px-6 py-2.5 rounded-lg border border-slate-700 text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition font-medium">
                    Cancel
                </a>
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-2.5 rounded-lg transition shadow-lg shadow-blue-500/20 font-medium active:scale-[0.98]">
                    Update Record
                </button>
            </div>
        </form>
    </div>
</div>
{{ end }}
